# 저장소 루트 검사: 구성 요소 하나에 속하지 않는 루트 쪽 검사를 한곳에서 돌린다. 구성 요소마다 있는 워크플로가 자기 폴더를
# 검사하고, 이 워크플로는 그 바깥(루트의 검사 도구·첫 화면·docs/·구성 요소 사이를 잇는 비교 도구)을 검사한다. 단계는 일곱이다.
#   1. tools/tests의 시험: 루트 검사 도구 다섯의 시험, 루트 문서(README.md, docs/)가 저장소의 파일과 git 이력에 맞는지 보는
#      시험, 루트 워크플로 둘(이 파일과 e2e.yml)의 규칙과 첫 화면의 워크플로 배지를 읽는 시험.
#   2. tools/check_root_numbers.py: 첫 화면과 docs/에 옮겨 적은 수치가 구성 요소 README에 기록된 글자와 같은지.
#   3. tools/check_links.py: 루트 문서의 상대 링크와 제목·줄 앵커가 끊기지 않았는지.
#   4. tools/check_cross_deps.py: 구성 요소가 다른 구성 요소의 파일을 경로로 쓰는 곳의 선언이 지금도 맞는지.
#   5. tools/check_evidence.py: 문서와 코드가 근거로 적은 커밋 해시, 기록 파일의 커밋 값, 등록한 '규칙 → 결과' 짝이 이
#      저장소의 이력과 맞는지(2026-11-25에 더했다. 처음 두 주는 문제를 보고만 한다).
#   6. tools/check_lock_drift.py: 잠금 파일(uv.lock, package-lock.json)이 등록한 갱신으로만 바뀌었는지.
#   7. evaluation/asr: 같은 발화 인식 비교 도구의 시험과 린트를 돌리고(그 폴더의 잠금으로 개발 도구를 설치한다), 커밋된 결과
#      파일을 지금의 코드와 재료로 다시 만들어 글자까지 견준다(asr-compare verify).
# - 경로 필터를 두지 않는다. 구성 요소 워크플로는 자기 폴더(와 자기 워크플로 파일)가 바뀔 때만 돌지만, 루트 수치의 출처는 구성
#   요소 README이고 링크와 의존 선언도 구성 요소 안의 파일을 가리켜서 어느 폴더가 바뀌어도 이 검사가 깨질 수 있다. 그래서 main
#   push와 모든 pull request에서 돌고, Actions 화면에서 수동으로도 돌릴 수 있다(workflow_dispatch).
# - 주기 실행(schedule)은 넣지 않는다: 저장소에 정기 실행을 만드는 지속 설정이다.
# - 구성 요소의 환경과 서비스는 설치하지도 띄우지도 않는다. 첫 단계의 시험 환경에는 pytest와 PyYAML만 들어가고, 다섯 검사 도구는
#   내려받을 의존성이 없는 스크립트다. 일곱째 단계는 evaluation/asr 폴더의 잠금(uv.lock)에서 그 폴더의 개발 도구(pytest와 ruff)와
#   도구 자신을 설치한다. GPU·모델·Docker도 쓰지 않는다.
name: repo-checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# 이 워크플로의 GITHUB_TOKEN은 저장소 내용을 읽기만 한다(어느 단계도 쓰지 않는다). 적어 두지 않으면 저장소 설정의 기본 권한을
# 따르므로, 그 기본값이 쓰기로 바뀌어도 읽기 전용으로 남게 여기서 정한다. 작업 단위 permissions는 두지 않는다.
permissions:
  contents: read
# 같은 ref의 실행은 하나씩 돈다(기다리는 실행은 가장 새것 하나만 남는다).
concurrency:
  group: repo-checks-${{ github.ref }}
jobs:
  checks:
    runs-on: ubuntu-latest
    # 설치와 일곱 단계를 넉넉히 덮는 상한. 넘으면 GitHub가 작업을 끊는다.
    timeout-minutes: 10
    env:
      # 루트 도구는 파이썬 3.11 이상을 요구한다(각 스크립트 머리의 requires-python, 표준 라이브러리 tomllib). e2e 워크플로와
      # 같이 3.11로 고정해, 러너의 기본 파이썬이 바뀌어도 같은 판에서 돈다.
      UV_PYTHON: "3.11"
    steps:
      # 액션은 태그가 아니라 커밋 SHA로 부른다. 태그는 다른 커밋으로 옮겨질 수 있어, 옮겨지면 검토하지 않은 코드가 이
      # 작업에서 돈다. 줄 끝 주석은 그 SHA를 가리키는 릴리스 태그다(e2e 워크플로와 같은 줄).
      # fetch-depth: 0은 모든 브랜치와 태그의 이력 전체를 받는다(이 액션의 fetch-depth 입력 설명). 기본값은 마지막 커밋 하나인데,
      # 그러면 두 곳이 CI에서만 실패한다. tools/check_cross_deps.py는 구성 요소 코드에 고정해 둔 사본의 원본 커밋(선언은
      # tools/cross-deps.toml)을 이력에서 풀고, tools/tests/test_docs.py는 태그 archive/<이름>과 HEAD에서 닿는 이동·병합 커밋을
      # 이력에서 찾는다. pull request의 체크아웃에는 로컬 main 브랜치가 없을 수 있어서 그 시험은 브랜치 이름이 아니라 HEAD에서
      # 찾는다.
      # persist-credentials: false는 토큰을 .git/config에 남기지 않는다(뒤 단계는 git으로 원격에 닿지 않는다).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # uv 판은 0.13.6으로 고정한다(e2e 워크플로와 같은 줄). 2026-11-24에 0.13.1에서 올렸다: uv 0.13.4 미만은 번들한 루트
      # 인증서 묶음에 폐기된 중간 CA와 이어진 루트가 들어 있다(공개 권고 PYSEC-2026-4321. tools/tests/test_workflows.py가
      # 하한을 지킨다). 캐시는 쓰지 않는다: 이 작업은 잠금 파일을 쓰지 않고(pytest와 PyYAML의 판은 아래 명령줄에 적었다)
      # 설치하는 것이 그 둘뿐이라 캐시로 아낄 것이 거의 없다.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          enable-cache: false
      # 루트 검사 도구와 루트 문서·워크플로를 읽는 시험을 모두 돈다. 루트에는 파이썬 프로젝트(pyproject.toml, uv.lock)가 없으므로
      # --no-project로 임시 환경을 만들고, 시험 도구의 판(pytest 9.1.1, PyYAML 6.0.3)은 support-agent 잠금 파일과 같게 명령줄에
      # 적는다. 구성 요소의 환경은 건드리지 않는다.
      - name: Unit tests for the root tools
        run: uv run --no-project --with pytest==9.1.1 --with pyyaml==6.0.3 pytest tools/tests -q -p no:cacheprovider
      # 첫 화면과 docs/의 수치가 root-numbers.toml이 묶어 둔 구성 요소 README 글자와 같은 수를 말하는지 본다(수를 계산하지
      # 않고 두 쪽의 글자만 견준다). 어긋나면 종료 코드 1이라 이 단계가 실패한다.
      - name: Root numbers match the component records
        run: uv run --no-project tools/check_root_numbers.py
      # README.md, docs/*.md, e2e/README.md의 상대 링크가 가리키는 파일과 제목·줄 앵커가 있는지 본다. 글쓴이의 Windows PC에서만
      # 열리는 경로(역슬래시, 드라이브 글자)도 끊긴 링크로 알린다.
      - name: Relative links in the root documents
        run: uv run --no-project tools/check_links.py
      # 구성 요소 사이의 파일 의존(tools/cross-deps.toml)이 지금도 맞는지, 설명 문서(docs/architecture.md)가 그것을 빠짐없이
      # 적고 있는지 본다. 고정한 사본의 원본 커밋을 이력에서 풀기 때문에 위 체크아웃의 전체 이력이 필요하다.
      - name: Cross-component dependencies
        run: uv run --no-project tools/check_cross_deps.py
      # 문서와 코드가 근거로 적은 커밋 해시가 이 저장소의 이력에서 풀리고 HEAD의 조상인지, 기록 파일의 커밋 값과 등록한
      # '규칙 → 결과' 짝(tools/evidence.toml)이 이력과 맞는지 본다. 이력에서 푸는 검사라 위 체크아웃의 전체 이력이 필요하다.
      # 처음 두 주는 보고만 한다. 그 뒤 이 인자를 뗀다. --report-only는 문제를 출력하되 종료 코드 0으로 끝낸다. 검사를
      # 끝내지 못한 경우(등록 파일이나 이력을 읽지 못함)의 종료 코드 2는 이 인자로도 바뀌지 않아 그때는 이 단계가 실패한다.
      - name: Commit hashes cited as evidence (report only)
        run: uv run --no-project tools/check_evidence.py --report-only
      # 추적되는 잠금 파일(uv.lock, package-lock.json)이 tools/locks.toml에 등록한 갱신으로만 바뀌었는지 본다. 잠금의 내용과
      # 이력을 git 객체에서 읽으므로 이 단계도 전체 이력이 필요하다. 등록하지 않은 변경이 있으면 종료 코드 1이라 이 단계가
      # 실패한다.
      - name: Lock files change only through registered updates
        run: uv run --no-project tools/check_lock_drift.py
      # 같은 발화 인식 비교 도구(evaluation/asr)를 그 폴더의 잠금(uv.lock)으로 설치해 린트와 시험을 돌린 뒤, 커밋된 결과 파일
      # (evaluation/asr/results/)을 지금의 코드와 재료로 다시 만들어 글자까지 견준다(asr-compare verify). 같은 코드와 재료에서는
      # 언제나 같은 바이트가 나오게 만든 도구라서, 결과 파일이 바뀌었거나 코드나 재료가 바뀌어 결과가 달라지면 이 단계가 실패한다.
      # 재료는 구성 요소 폴더의 추적 파일(리포트, 매니페스트)이라 이 체크아웃에 이미 있다. `uv sync --frozen`은 잠금을 고치지 않고
      # 그대로 설치하고, 뒤의 `uv run --frozen --no-sync`는 설치한 환경을 그대로 쓴다. 파이썬 판은 위 작업 환경의 UV_PYTHON(3.11)을
      # 따른다.
      - name: Same-utterance ASR comparison (tests and recomputation)
        run: |
          uv sync --frozen --directory evaluation/asr
          uv run --frozen --no-sync --directory evaluation/asr ruff check .
          uv run --frozen --no-sync --directory evaluation/asr ruff format --check .
          uv run --frozen --no-sync --directory evaluation/asr pytest -q
          uv run --frozen --no-sync --directory evaluation/asr asr-compare verify
