# 통화 한 건 배선 시연(e2e/): 모델 없는 두 오프라인 앱(support-agent, call-summary)을 러너에 띄우고 대본 한 건을
# HTTP로 흘려 보낸 뒤, 나온 리포트가 저장소의 예시(e2e/examples/shop-cancel/)와 바이트까지 같은지 본다. 상담 앱이
# 후처리 앱을 직접 불러 기록을 만드는 길(관리자 API)도 한 번 지난다(--service-link). 품질 측정이 아니라 두 서비스가
# HTTP 계약대로 이어지는지 보는 확인이다(e2e/README.md).
# - 경로 필터를 두지 않는다: 두 서비스 폴더와 e2e/ 가운데 어느 것이 바뀌어도 이어짐이 깨질 수 있어서, main push와
#   모든 pull request에서 돈다.
# - 주기 실행(schedule)은 넣지 않는다: 저장소에 정기 실행을 만드는 지속 설정이다. 다시 돌리기는 Actions 화면의 Re-run으로 한다.
# - GPU·모델·Docker를 쓰지 않는다. 두 앱은 각 서비스의 기본 의존성만 설치한 환경에서 uvicorn으로 띄운다.
name: e2e
on:
  push:
    branches: [main]
  pull_request:
# 이 워크플로의 GITHUB_TOKEN은 저장소 내용을 읽기만 한다. 적어 두지 않으면 저장소 설정의 기본 권한을 따르므로, 그
# 기본값이 쓰기로 바뀌어도 읽기 전용으로 남게 여기서 정한다. 작업 단위 permissions는 두지 않는다.
permissions:
  contents: read
# 같은 ref의 실행은 하나씩 돈다(기다리는 실행은 가장 새것 하나만 남는다).
concurrency:
  group: e2e-${{ github.ref }}
jobs:
  call:
    runs-on: ubuntu-latest
    # 설치와 두 앱을 기다리는 시간(최대 180초)을 넉넉히 덮는 상한. 넘으면 GitHub가 작업을 끊는다.
    timeout-minutes: 20
    env:
      # 세 환경(두 서비스와 e2e)을 모두 파이썬 3.11로 만든다(구성 요소 워크플로와 같은 판).
      UV_PYTHON: "3.11"
    steps:
      # 액션은 태그가 아니라 커밋 SHA로 부른다. 태그는 다른 커밋으로 옮겨질 수 있어, 옮겨지면 검토하지 않은 코드가 이
      # 작업에서 돈다. 줄 끝 주석은 그 SHA를 가리키는 릴리스 태그다. persist-credentials: false는 토큰을 .git/config에
      # 남기지 않는다(뒤 단계는 git으로 원격에 닿지 않는다).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv 판은 0.13.6으로 고정한다. call-summary 워크플로(와 그 Docker 이미지)와 같은 줄이다. e2e와 call-summary의 잠금
      # 파일을 쓴 판은 0.13.1이지만 `uv sync --frozen`은 잠금을 다시 쓰지 않으므로 그보다 높아도 잠금은 바뀌지 않는다.
      # 2026-11-24에 올렸다: uv 0.13.4 미만은 번들한 루트 인증서 묶음에 폐기된 중간 CA와 이어진 루트가 들어 있다(공개 권고
      # PYSEC-2026-4321. tools/tests/test_workflows.py가 하한을 지킨다).
      # 캐시 키는 세 잠금 파일로 만들고 이름(e2e)을 붙여, 같은 러너에서 캐시를 켠 다른 작업과 키가 겹치지 않게 한다.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          enable-cache: true
          cache-suffix: e2e
          cache-dependency-glob: |
            e2e/uv.lock
            support-agent/uv.lock
            call-summary/uv.lock
      # 두 서비스는 기본 의존성만 설치한다(--no-dev). 두 서비스의 Docker 이미지와 같은 설치 범위이고, 음성·학습 그룹
      # (torch 등)은 오프라인 앱에 필요 없다.
      - name: Install the two services (base dependencies only)
        run: |
          uv sync --frozen --no-dev --directory support-agent
          uv sync --frozen --no-dev --directory call-summary
      # e2e 패키지와 시험 도구(dev 그룹의 pytest, ruff)를 설치한다.
      - name: Install the e2e package
        working-directory: e2e
        run: uv sync --frozen
      # 린트와 단위 시험. 시험은 앱 없이 가짜 서비스로 돌고, 저장소의 예시 리포트가 대본·렌더링 코드와 맞는지도 본다.
      - name: Lint and unit tests
        working-directory: e2e
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync pytest -q
      # 실행마다 새로 만드는 임시 관리자 토큰. add-mask로 로그에 찍히지 않게 가리고, 뒤 단계에는 GITHUB_ENV로만 넘긴다.
      - name: Make a throwaway admin token
        run: |
          token="$(openssl rand -hex 16)"
          echo "::add-mask::$token"
          echo "E2E_ADMIN_TOKEN=$token" >> "$GITHUB_ENV"
      # support-agent 오프라인 앱을 기본 포트 8062에 띄운다(러너는 매번 새것이라 그 포트에 다른 서비스가 없다). 관리자
      # API를 켜려고 같은 토큰을 주고, DB는 러너 임시 폴더의 새 SQLite 파일이다. SUPPORT_AGENT_SUMMARY_URL은 상담 앱이
      # 후처리 앱을 부를 주소(아래 call-summary 앱, 8072)다. 상담 앱은 시작할 때 그 주소에 연결하지 않고 관리자 API가
      # 불릴 때 연결하므로(support-agent/src/support_agent/service/app.py의 lifespan은 클라이언트만 만든다) 두 앱을
      # 띄우는 차례는 상관없다. 뒤 단계가 도는 동안 배경에서 돈다.
      - name: Start the support-agent offline app
        working-directory: support-agent
        run: |
          SUPPORT_AGENT_ADMIN_TOKEN="$E2E_ADMIN_TOKEN" SUPPORT_AGENT_DATABASE_URL="sqlite:///$RUNNER_TEMP/support-e2e.db" \
            SUPPORT_AGENT_SUMMARY_URL="http://127.0.0.1:8072" \
            nohup uv run --frozen --no-sync uvicorn support_agent.service.offline:create_offline_app \
            --factory --host 127.0.0.1 --port 8062 > "$RUNNER_TEMP/support-agent.log" 2>&1 &
      # call-summary 오프라인 앱(업종마다 고정 답)을 기본 포트 8072에 배경으로 띄운다.
      - name: Start the call-summary offline app
        working-directory: call-summary
        run: |
          nohup uv run --frozen --no-sync uvicorn call_summary.service:create_offline_app \
            --factory --host 127.0.0.1 --port 8072 > "$RUNNER_TEMP/call-summary.log" 2>&1 &
      # 두 앱이 준비될 때까지 최대 180초 기다린 뒤 통화 한 건을 돌린다. 주소는 명령줄 기본값(8062, 8072)이다.
      # --service-link는 통화가 끝난 뒤 상담 앱의 관리자 API를 불러, 상담 앱이 스스로 후처리 앱을 불러 만든 기록이
      # 직접 받은 기록과 같은지, 그 일이 감사 로그에 남았는지도 본다. 검사가 하나라도 실패하거나 그 확인이 어긋나면
      # 종료 코드 1, 돌리지 못하면 2라서 이 단계가 실패한다.
      - name: Run one call
        working-directory: e2e
        run: uv run --frozen --no-sync call-e2e --script calls/shop-cancel.json --service-link --wait 180 --out "$RUNNER_TEMP/e2e-report"
      # 새 리포트가 저장소의 예시와 바이트까지 같은지 본다. 다르면 diff가 바뀐 줄을 보여 주고 이 단계가 실패한다.
      - name: The report matches the committed example
        run: diff -u e2e/examples/shop-cancel "$RUNNER_TEMP/e2e-report"
      # 성공·실패와 상관없이 리포트를 작업 요약에, 두 앱의 로그를 이 단계의 로그에 남긴다(파일이 없으면 넘어간다).
      - name: Report and service logs
        if: always()
        run: |
          cat "$RUNNER_TEMP/e2e-report/call-report.md" >> "$GITHUB_STEP_SUMMARY" || true
          cat "$RUNNER_TEMP/support-agent.log" "$RUNNER_TEMP/call-summary.log" || true
