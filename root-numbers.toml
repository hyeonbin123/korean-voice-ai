# 파일 전체에 건다(section을 주지 않는다): 단계별 결과 표 밖의 절에 선언 없는 퍼센트 수가 끼어들어도 잡으려는 것이다.
[[coverage]]
where = "README.md"

# '단계별 결과' 절 표의 대표 수치. 표의 줄은 통화 흐름 순서(음성 인식의 whisper-ko-ft와 stt-scratch, 실시간 음성
# 계층의 voice-translator, 상담 에이전트의 support-agent, 상담 후처리의 call-summary)이고, 조건 글은 그 수가 든 표의
# 같은 줄에 있다. 표에서 대표 수치와 같은 칸에 함께 적은 짝 수치는 굵게
# 적는다(훑어볼 때 수가 조건 글에 묻히지 않게. 좋아진 수와 나빠진 수를 똑같이 굵게 한다). 그래서 그 선언의 context에는
# 굵게 표시 `**`가 수 앞에 들어 있다. 테스트 수와 '40과제 × 4회' 같은 조건의 크기는 굵게 적지 않는다.

# whisper-ko-ft: 결과 절 'test (단계마다 한 번 측정)' 표. Zeroth test CER 줄에서 4.48은 학습하지 않은
# whisper-large-v3-turbo 열, 1.96은 turbo + LoRA 열이다(같은 줄의 whisper-small 열과 파인튜닝한 small 열은 옮기지 않는다).
# 이 줄은 정답과 가설의 숫자 표기를 맞추지 않은 CER이라 첫 화면 칸에 그렇게 적는다. 위 docs/model-choices.md의
# 4.22·2.68은 같은 절의 숫자 표기를 맞춘 CER 표에서 왔다(4.22는 같은 기준선 모델, 2.68은 숫자 표기를 바꿔 학습한 모델).
# 5.21과 6.94는 같은 표의 FLEURS 한국어 test CER 줄에서 같은 두 열이다. 같은 모델이 다른 도메인에서는 나빠졌다는
# 짝 수치로, 학습에서 본 문장 조건의 1.96만 보이지 않게 같은 칸에 적는다. 이 모델의 판정 '도메인 전용'은 같은 README의
# 단계 표와 판정 문단에 있다.

