# 루트 문서에 옮겨 적은 수치의 출처 선언.
#
# 무엇을 하나
#   첫 화면(README.md)과 docs/ 문서는 구성 요소 폴더의 기록(README 등)에 적힌 수치를 옮겨 적는다. 옮겨 적은 수는
#   출처가 바뀌어도 저절로 따라 바뀌지 않는다. 그래서 수마다 '루트 문서의 이 자리 글'과 '구성 요소 기록의 이 자리
#   글'을 짝지어 여기에 적고, tools/check_root_numbers.py가 두 쪽의 마지막 수가 여전히 같은 글자인지 대조한다.
#   수를 다시 계산하지는 않는다. 기록 자체를 다시 계산하는 일은 각 구성 요소의 시험이 한다(docs/measurement.md).
#
# 표와 키 (자세한 규칙은 tools/check_root_numbers.py 머리말)
#   [[number]]    where·section: 루트 문서 파일과 그 안의 제목('#' 없이). context: 그 절에 정확히 한 번 나오는
#                 한 줄 글이고 마지막 수가 value다. condition: context와 같은 줄에 있어야 하는 조건 글.
#                 source·source_section·source_context: 구성 요소 기록 쪽의 같은 검사.
#                 value: 쉼표 없이 적은 수 글자.
#   [[snapshot]]  구성 요소 기록 파일에 없는 수(CI에서 센 테스트 수, 명령으로 센 커밋 수). where·section·context·
#                 value는 [[number]]와 같고(section은 꼭 준다), as_of(YYYY-MM-DD)는 그 절 본문에 글로 있어야 하며,
#                 evidence에 어느 실행이나 명령에서 셌는지 적는다. 수를 다시 세지는 않는다. as_of는 그 수가 어느
#                 시점의 수인지를 뜻한다: CI에서 센 수는 실행한 날, 날짜로 닫은 범위를 센 수는 그 범위의 끝 날.
#   [[coverage]]  where 파일(section이 없으면 파일 전체)에서 '%'·'%p'가 붙은 수가 모두 위 선언의 context 안에
#                 들어 있는지 본다. 선언 없이 끼어든 퍼센트 수를 잡으려는 것이다.
#
# 주의
#   - source_section은 구성 요소 기록의 제목을 글자 그대로 옮긴다(제목이 바뀌면 검사가 실패해 알려 준다).
#   - context와 source_context는 그 절에서 한 번만 나와야 하므로, 같은 수가 여러 번 나오는 표에서는 줄 앞쪽 글까지
#     넣어 자리를 하나로 정한다.

# ---------------------------------------------------------------------------------------------
# docs/model-choices.md
# ---------------------------------------------------------------------------------------------

[[coverage]]
where = "docs/model-choices.md"

