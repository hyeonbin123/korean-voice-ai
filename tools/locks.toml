# 잠금 파일(uv.lock, package-lock.json)의 이력 등록. tools/check_lock_drift.py가 읽어, 이 저장소가 추적하는 잠금 파일이
# 여기 적힌 갱신으로만 바뀌었는지 git 이력과 견준다.
#
# 왜 두나: 잠금 파일은 구성 요소가 설치하는 패키지 판을 고정한다. 판이 하나만 올라가도 같은 코드가 다른 환경에서 도는 것이
# 되어, 그 뒤의 측정과 시험 결과를 앞선 기록과 같은 조건에서 나온 값으로 읽을 수 없다. 그런데 판 올림은 파일 크기를 바꾸지
# 않을 수도 있어 크기로는 못 잡는다. 그래서 잠금을 바꾼 커밋과 바뀐 판을 이 파일에 글자로 남기고, 등록하지 않은 변경이
# 생기면 검사가 실패해서 알려 준다.
#
# 새 잠금 파일을 들이거나 기존 잠금을 바꾸면 여기에 등록해야 검사(CI)가 통과한다. 커밋 해시를 적어야 하므로 등록은
# 잠금을 바꾼 커밋 뒤에 적는다.
#
# [[lock]]       잠금 파일 하나. 이름이 uv.lock이나 package-lock.json인 추적 파일은 모두 여기에 있어야 한다.
#   path         저장소 뿌리 기준 경로(`/` 구분)
#   added        그 경로에 이 파일을 들인 커밋(40자). 다른 저장소의 이력을 폴더 아래로 옮겨 들인 구성 요소라면 그 폴더를
#                옮긴 커밋이다. 검사는 이름을 따라가지 않으므로(옛 경로가 구성 요소끼리 같아 다른 이력으로 넘어간다) 이
#                커밋에서 이력이 멈춘다.
#   base         added 커밋에서의 그 파일의 blob(40자). `git rev-parse <added>:<path>`가 내는 값
#   what         무엇의 잠금인지 한 줄
#   [[lock.update]]  added 뒤에 그 잠금을 바꾼 커밋 하나(바뀐 적이 없으면 쓰지 않는다). 일어난 순서대로, 옛것부터 적는다.
#     commit     그 커밋(40자). 부모가 하나여야 한다(병합 커밋으로 잠금을 바꾸지 않는다).
#     date       그 커밋의 커밋 날짜. 따옴표로 감싼 YYYY-MM-DD. `git show -s --format=%cs <commit>`와 같아야 한다.
#     changes    그 커밋이 잠금에서 바꾼 (패키지, 판)의 목록. 한 건은 세 꼴 가운데 하나다(낱말 사이는 공백 하나).
#                  "<패키지> <옛 판> -> <새 판>"   판이 바뀜
#                  "+ <패키지> <판>"               새로 들어옴
#                  "- <패키지> <판>"               빠짐
#                검사는 없어진 (패키지, 판)과 생긴 (패키지, 판)이 실제 차이와 각각 같은지 본다. 그래서 한 패키지의 판 둘이
#                함께 바뀌면 화살표 두 건으로 적고, 화살표 한 건 대신 `-`와 `+` 둘로 적어도 같은 뜻이다. package-lock.json은
#                패키지 자리에 packages의 경로(`node_modules/<이름>`)를 적고 뿌리는 `.`로 적는다. 판은 그대로이고 다른
#                것(주소, 해시)만 바뀐 갱신이면 빈 목록 `[]`. 판이 없는 항목(uv.lock에서 version이 없는 패키지)이 낀
#                변화는 적을 수 없어 검사가 그대로 문제로 알린다.
#     why        왜 바꿨는지 공개 문서나 커밋 메시지를 가리키는 한 줄
#
# 예(자리 표시만 적었다. 해시는 40자 소문자 16진수로 채운다):
#
#   [[lock]]
#   path = "<구성 요소>/uv.lock"
#   added = "<그 폴더를 들인 커밋 40자>"
#   base = "<그 커밋에서의 blob 40자>"
#   what = "<구성 요소>의 파이썬 잠금"
#
#     [[lock.update]]
#     commit = "<잠금을 바꾼 커밋 40자>"
#     date = "<YYYY-MM-DD>"
#     changes = ["<패키지> <옛 판> -> <새 판>", "+ <새로 들어온 패키지> <판>", "- <빠진 패키지> <판>"]
#     why = "<까닭을 적은 문서나 커밋>"
