# 커밋 해시 참조 검사(tools/check_evidence.py)가 읽는 등록 파일.
#
# 그 도구는 추적 파일(HEAD의 내용)에서 7~40자 소문자 16진수 낱말을 뽑아 이 저장소의 이력으로 풀어 본다. 낱말 대부분은
# 커밋이 아닌 해시(데이터 해시, 다이제스트, 다른 저장소의 커밋 등)라서 풀리지 않는 것이 정상이다. 다만 문서(.md)가
# 커밋 참조라고 밝혀 적은 낱말(같은 줄에서 백틱 한 쌍 안이 통째로 그 낱말이거나, `커밋`·`commit` 바로 뒤에 온 낱말)은
# 이 저장소의 커밋으로 풀려야 한다. 이 저장소의 커밋이 아닌 해시(다른 저장소의 커밋 등)를 그렇게 적었다면 아래
# [[external]]에 등록해 통과시킨다. 규칙 전체와 종료 코드는 `uv run --no-project tools/check_evidence.py --help`에 있다.
#
# 등록은 그 파일의 그 낱말에만 통한다. 낱말이 그 파일에서 사라졌거나(낡은 등록) 이 저장소의 커밋으로 풀리면(잘못
# 등록) 그 등록이 문제로 알려진다. 모르는 표나 키, 빠진 키, 빈 글, 꼴이 틀린 값도 조용히 넘기지 않는다.
#
# [[external]]   다른 저장소의 해시를 문서가 커밋 참조처럼 적은 곳 하나.
#   hash         문서에 적힌 낱말 그대로(7~40자 소문자 16진수). 앞부분만 같아서는 통하지 않는다. 숫자뿐인 값은
#                그 파일에서 커밋 참조로 적힌 자리에 있어야 낱말로 뽑혀 등록이 통한다.
#   where        그 낱말이 적힌 파일(저장소 뿌리 기준 `/` 경로). HEAD의 트리에 있는 검사 대상 파일이어야 한다.
#   what         무엇의 해시인지 한 줄(어느 저장소의 어느 커밋인지 등).
#
# [[record]]     값이 이 저장소의 커밋인 키를 담은 기록 파일들(JSON) 하나. 그 키의 값마다 이 저장소의 커밋으로 풀리고
#                HEAD의 조상인지 본다(.jsonl은 줄마다). 같은 객체에 git_tree가 있으면 그 커밋의 component 폴더
#                트리와 같은지도 본다.
#   glob         저장소 뿌리 기준 `/` 경로. 조각(`/` 사이)마다 견주고 `*`는 폴더 하나를 넘지 않는다. `**`는 받지 않는다.
#   keys         커밋 값을 담은 키 이름의 목록. 모든 깊이에서 찾는다. `revision`처럼 다른 저장소의 값이 든 키는
#                등록하지 않는다. 키마다 glob에 맞는 파일 어딘가에 적어도 한 번은 나와야 한다(하나도 안 나오면 키
#                이름의 오타이거나 낡은 등록이라 그 항목의 문제다. 아무것도 검사하지 않은 채 통과하지 않게 하려는
#                것이다. 키가 없는 파일이 섞여 있는 것은 괜찮다).
#   component    그 파일이 속한 구성 요소 폴더 이름(HEAD의 트리 맨 위에 있는 폴더).
#   what         무엇의 기록인지 한 줄.
#
# [[pair]]       '규칙 → 결과' 짝 하나: 규칙을 먼저 커밋하고 그 규칙으로 쟀다고 문서가 적은 커밋 둘. 글에서 기계로 뽑을
#                수 없어 사람이 읽고 확인한 짝만 등록하고, 등록한 짝만 본다(모든 측정을 망라하지 않는다).
#   id           짝의 이름(등록 안에서 겹치지 않는다).
#   rule, result 규칙 커밋과 결과 커밋(7~40자 소문자 16진수. 숫자뿐이어도 된다). 둘 다 이 저장소의 커밋으로 풀리고
#                HEAD의 조상이어야 하고, 규칙이 결과의 조상이며 커밋 시각이 규칙 <= 결과여야 한다.
#   where        그 순서를 적은 문서(HEAD의 트리에 있는 파일). 두 해시의 앞 7자가 글자로 있어야 한다.
#   what         무엇을 잰 짝인지 한 줄.
#
# 긴 16진수가 값으로 오는 키(hash, rule, result)의 이름은 '토큰'이나 '키' 같은 뜻이 든 말을 피했다. 커밋 전 비밀값
# 검사가 그런 이름 뒤의 긴 16진수를 비밀값으로 볼 수 있어서다. keys의 값은 키 이름의 목록이라 해당하지 않는다.
#
# 아래가 이 저장소의 실제 등록이다.

# ---------------------------------------------------------------------------------------------
# 이 저장소의 커밋이 아닌 해시 (문서가 커밋 참조처럼 적은 것)
#
# 갈래는 셋이다: 다른 프로젝트 저장소의 커밋, Hugging Face 모델·데이터셋의 revision, 파일 해시나 다이제스트의 앞부분.
# 등록하기 전에 그 문서의 그 줄을 읽어 무엇의 해시인지 확인했다. 차례는 파일 경로 순, 그 안에서 낱말 순이다.
# ---------------------------------------------------------------------------------------------

